name: Ghibli Park Boo-Woo Ticket Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-ticket:
    runs-on: ubuntu-latest

    steps:

    - name: 저장소 코드 불러오기
      uses: actions/checkout@v4

    - name: 파이썬 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install playwright requests
        playwright install chromium
        playwright install-deps

    - name: Boo-Woo 접속 테스트
      env:
        KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
      run: |
        python gibli_tiket.py

    - name: 디버그 파일 저장
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lticket-debug
        path: |
          lticket_test.png
          lticket_test.html
        if-no-files-found: ignore
