name: Ghibli Park Boo-Woo Ticket Monitor

on:
  schedule:
    # 5분마다 자동 실행 (Cron 표현식: UTC 기준)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 버튼을 눌러 수동 실행도 가능하도록 설정

jobs:
  check-ticket:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v3

    - name: 파이썬 3.10 설치
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install playwright requests
        playwright install chromium
        playwright install-deps

    - name: 부우 티켓 크롤러 실행
      env:
        KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
      run: |
        python gibli_tiket.py